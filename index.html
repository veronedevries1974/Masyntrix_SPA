        <!--CSS overschrijft Bootstrap-->
        <style>
            html {
                scroll-behavior: smooth;
            }
            body {
                font-family: "JetBrains Mono", monospace;
                font-optical-sizing: auto;
                font-weight: 400;
                font-style: normal;
            }
            :root, [data-bs-theme="dark"] {
                --bs-body-bg: #030814;          /* Diep donkerblauw/zwart (achtergrondkleur logo) */
                --bs-body-color: #f0f4f8;       /* Helder, zacht wit/grijs voor tekst */
                --bs-primary: #00d2ff;          /* Fel neonblauw (linkerkant logo) */
                --bs-secondary: #bd00ff;        /* Fel neonpaars/magenta (rechterkant logo) */
                --bs-dark: #01040a;             /* Extra donker accent voor kaarten/secties */
                --bs-info: #00f5d4;             /* Neon cyaan voor extra accenten of badges */
                --bs-link-color: #00d2ff;       /* Neonblauw voor links */
            }

            /* 1. Kleurverloop (Gradient) zoals in de tekst en het logo */
            .bg-masyntrix-gradient {
                background: linear-gradient(135deg, var(--bs-primary) 0%, var(--bs-secondary) 100%) !important;
            }

            .text-masyntrix-gradient {
                background: linear-gradient(135deg, var(--bs-primary) 0%, var(--bs-secondary) 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                display: inline-block;
            }

            /* 2. Neon Glow Effecten */
            .glow-blue {
                box-shadow: 0 0 15px rgba(0, 210, 255, 0.5), 0 0 5px rgba(0, 210, 255, 0.3);
                border: 1px solid var(--bs-primary);
            }

            .glow-purple {
                box-shadow: 0 0 15px rgba(189, 0, 255, 0.5), 0 0 5px rgba(189, 0, 255, 0.3);
                border: 1px solid var(--bs-secondary);
            }

            /* 3. Moderne Masyntrix Knoppen */
            .btn-masyntrix {
                background: linear-gradient(135deg, var(--bs-primary) 0%, var(--bs-secondary) 100%);
                color: #030814 !important; /* Donkere tekst op felle achtergrond voor leesbaarheid */
                font-weight: 600;
                border: none;
                transition: all 0.3s ease;
            }

            .btn-masyntrix:hover {
                transform: translateY(-2px);
                box-shadow: 0 0 20px rgba(0, 210, 255, 0.6), 0 0 30px rgba(189, 0, 255, 0.4);
            }

            .border-tech {
                border: 1px solid transparent;
                border-image: linear-gradient(135deg, var(--bs-primary), var(--bs-secondary)) 1;
            }
        </style>
    
    </head>
